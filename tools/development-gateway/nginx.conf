map $http_x_forwarded_proto $external_scheme {
  default $scheme;
  https https;
}

server {
  listen 8080;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  include /etc/nginx/includes/security.conf;

  proxy_http_version 1.1;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Content-Security-Policy;

  location = /a { return 302 /a/; }
  location = /b { return 302 /b/; }

  location /a/ {
    set $frontend frontend-a:8080;
    rewrite ^/a/(.*)$ /$1 break;
    proxy_pass http://$frontend;
    proxy_redirect off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    proxy_set_header X-Forwarded-Prefix /a;
  }

  location /b/ {
    set $frontend frontend-b:8080;
    rewrite ^/b/(.*)$ /$1 break;
    proxy_pass http://$frontend;
    proxy_redirect off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    proxy_set_header X-Forwarded-Prefix /b;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
