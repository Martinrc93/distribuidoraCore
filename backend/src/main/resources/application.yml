spring:
  application:
    name: distribuidora-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        size: 4

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          show-details: never
        readiness:
          show-details: never
  metrics:
    tags:
      application: distribuidora-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: ecs

app:
  public-url: ${APP_PUBLIC_URL:}
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    jwt-secret: ${JWT_SECRET:}
    jwt-issuer: ${JWT_ISSUER:distribuidora-local}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    bootstrap-admin-email: ${ADMIN_EMAIL:}
    bootstrap-admin-password: ${ADMIN_PASSWORD:}
    require-bootstrap-password-match: ${REQUIRE_BOOTSTRAP_PASSWORD_MATCH:false}
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
      login-per-ip: ${AUTH_RATE_LIMIT_LOGIN_PER_IP:20}
      login-per-account: ${AUTH_RATE_LIMIT_LOGIN_PER_ACCOUNT:10}
      refresh-per-ip: ${AUTH_RATE_LIMIT_REFRESH_PER_IP:60}
      activate-per-ip: ${AUTH_RATE_LIMIT_ACTIVATE_PER_IP:10}
  seed-demo: ${SEED_DEMO:false}
  demo-password: ${DEMO_PASSWORD:}
  outbox:
    retention:
      days: ${OUTBOX_RETENTION_DAYS:90}
    worker:
      enabled: ${OUTBOX_WORKER_ENABLED:true}
      poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
      batch-size: ${OUTBOX_WORKER_BATCH_SIZE:10}
  notifications:
    timeout-ms: ${NOTIFICATION_PROVIDER_TIMEOUT_MS:10000}
    retention:
      enabled: ${NOTIFICATION_RETENTION_ENABLED:true}
      days: ${NOTIFICATION_RETENTION_DAYS:90}
      cron: ${NOTIFICATION_RETENTION_CRON:0 30 3 * * *}
    email:
      webhook-url: ${EMAIL_WEBHOOK_URL:}
      webhook-token: ${EMAIL_WEBHOOK_TOKEN:}
    whatsapp:
      webhook-url: ${WHATSAPP_WEBHOOK_URL:}
      webhook-token: ${WHATSAPP_WEBHOOK_TOKEN:}

info:
  app:
    name: Distribuidora Backend
    description: API modular para gestión comercial
    version: 0.1.0
