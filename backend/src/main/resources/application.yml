spring:
  application:
    name: distribuidora-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/distribuidora}
    username: ${DB_USERNAME:distribuidora}
    password: ${DB_PASSWORD:distribuidora}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-issuer: ${JWT_ISSUER:distribuidora-local}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    bootstrap-admin-email: ${ADMIN_EMAIL:}
    bootstrap-admin-password: ${ADMIN_PASSWORD:}
  seed-demo: ${SEED_DEMO:false}
  demo-password: ${DEMO_PASSWORD:}

info:
  app:
    name: Distribuidora Backend
    description: API modular para gestión comercial
    version: 0.1.0
