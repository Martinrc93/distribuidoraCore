server_tokens off;
client_max_body_size 2m;
gzip on;
gzip_types text/css application/javascript image/svg+xml;

add_header_inherit merge;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self' blob:; connect-src 'self' http://127.0.0.1:47891; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
