name: Backend PostgreSQL

on:
  push:
    branches: [main, support, "feature/**"]
  pull_request:
    branches: [main, support, "feature/**"]

permissions:
  contents: read

concurrency:
  group: backend-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: distribuidora_test
          POSTGRES_USER: distribuidora
          POSTGRES_PASSWORD: distribuidora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U distribuidora -d distribuidora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run backend tests with PostgreSQL integration enabled
        working-directory: backend
        env:
          POSTGRES_TEST_URL: jdbc:postgresql://127.0.0.1:5432/distribuidora_test
          POSTGRES_TEST_USERNAME: distribuidora
          POSTGRES_TEST_PASSWORD: distribuidora
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Require all PostgreSQL integration tests to run
        shell: python
        run: |
          from pathlib import Path
          from xml.etree import ElementTree

          reports = list(Path("backend/target/surefire-reports").glob("TEST-*.xml"))
          failsafe_dir = Path("backend/target/failsafe-reports")
          if failsafe_dir.exists():
              reports += list(failsafe_dir.glob("TEST-*.xml"))
          assert reports, "Surefire reports are missing"
          skipped = [p.name for p in reports if int(ElementTree.parse(p).getroot().get("skipped", "0"))]
          assert not skipped, f"Skipped test suites: {skipped}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
