services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-distribuidora}
      POSTGRES_USER: ${POSTGRES_USER:-distribuidora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-distribuidora}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-distribuidora}
      DB_USERNAME: ${POSTGRES_USER:-distribuidora}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-distribuidora}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-please-32chars}
      JWT_ISSUER: ${JWT_ISSUER:-distribuidora-local}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-ChangeMe123!}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres-data:
