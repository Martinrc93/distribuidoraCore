# Frozen main images. Build and deploy explicitly with dev-instances.cmd update.
name: distribuidora-dev-instances

x-database: &database
  image: postgres:16-alpine
  environment:
    POSTGRES_DB: distribuidora
    POSTGRES_USER: distribuidora
    POSTGRES_PASSWORD: local-development-only
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U distribuidora -d distribuidora"]
    interval: 5s
    timeout: 5s
    retries: 20

x-backend: &backend
  image: distribuidora-main-backend:${DISTRIBUIDORA_MAIN_IMAGE_TAG:?Run dev-instances.cmd update first}
  pull_policy: never
  environment: &backend-environment
    SPRING_PROFILES_ACTIVE: local
    DB_USERNAME: distribuidora
    DB_PASSWORD: local-development-only
    SEED_DEMO: "false"
    ADMIN_EMAIL: admin@demo
    ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-ChangeMe123!}
    REQUIRE_BOOTSTRAP_PASSWORD_MATCH: ${DEV_TUNNEL_ENABLED:-false}
    FORWARD_HEADERS_STRATEGY: framework

x-frontend: &frontend
  pull_policy: never

services:
  db-a:
    <<: *database
    volumes:
      - data-a:/var/lib/postgresql/data
    networks: [system-a]

  db-b:
    <<: *database
    volumes:
      - data-b:/var/lib/postgresql/data
    networks: [system-b]

  backend-a:
    <<: *backend
    environment:
      <<: *backend-environment
      DB_URL: jdbc:postgresql://db-a:5432/distribuidora
      JWT_SECRET: ${JWT_SECRET:-development-system-a-secret-at-least-32-characters}
      JWT_ISSUER: distribuidora-dev-a
    depends_on:
      db-a:
        condition: service_healthy
    networks: [system-a]

  backend-b:
    <<: *backend
    environment:
      <<: *backend-environment
      DB_URL: jdbc:postgresql://db-b:5432/distribuidora
      JWT_SECRET: ${DEV_JWT_SECRET_B:-development-system-b-secret-at-least-32-characters}
      JWT_ISSUER: distribuidora-dev-b
    depends_on:
      db-b:
        condition: service_healthy
    networks: [system-b]

  frontend-a:
    <<: *frontend
    image: distribuidora-main-frontend-a:${DISTRIBUIDORA_MAIN_IMAGE_TAG:?Run dev-instances.cmd update first}
    environment:
      DEV_BACKEND_HOST: backend-a
    depends_on:
      backend-a:
        condition: service_healthy
    networks: [system-a, entrance]

  frontend-b:
    <<: *frontend
    image: distribuidora-main-frontend-b:${DISTRIBUIDORA_MAIN_IMAGE_TAG:?Run dev-instances.cmd update first}
    environment:
      DEV_BACKEND_HOST: backend-b
    depends_on:
      backend-b:
        condition: service_healthy
    networks: [system-b, entrance]

  gateway:
    image: distribuidora-main-gateway:${DISTRIBUIDORA_MAIN_IMAGE_TAG:?Run dev-instances.cmd update first}
    pull_policy: never
    ports:
      - "${DEV_GATEWAY_BIND:-127.0.0.1}:${DEV_GATEWAY_PORT:-3100}:8080"
    depends_on:
      frontend-a:
        condition: service_healthy
      frontend-b:
        condition: service_healthy
    networks: [entrance]

  ngrok:
    image: ngrok/ngrok:3-alpine@sha256:a51a7637a70be573615b01852af0419c4ab9dc857601b3d61ea2a082be3ec0d3
    profiles: [tunnel]
    command: ["http", "http://gateway:8080", "--url=${DEV_NGROK_URL:-}", "--inspect=false", "--log=stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      gateway:
        condition: service_healthy
    networks: [entrance]

volumes:
  data-a:
  data-b:

networks:
  entrance:
  system-a:
  system-b:
