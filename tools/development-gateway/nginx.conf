map $http_x_forwarded_proto $external_scheme {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $external_scheme;

  location = /a { return 302 /a/; }
  location = /b { return 302 /b/; }

  location /a/ {
    set $frontend frontend-a:80;
    rewrite ^/a/(.*)$ /$1 break;
    proxy_pass http://$frontend;
    proxy_redirect off;
    proxy_set_header X-Forwarded-Prefix /a;
  }

  location /b/ {
    set $frontend frontend-b:80;
    rewrite ^/b/(.*)$ /$1 break;
    proxy_pass http://$frontend;
    proxy_redirect off;
    proxy_set_header X-Forwarded-Prefix /b;
  }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store" always;
  }
}
