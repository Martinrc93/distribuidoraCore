spring:
  datasource:
    url: jdbc:h2:mem:distribuidora-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  security:
    user:
      name: test-admin
      password: test-password

app:
  security:
    jwt-secret: test-secret-that-is-at-least-32-bytes-long
    jwt-issuer: test
  seed-demo: false
  demo-password:

management:
  endpoints:
    web:
      exposure:
        include: health,info
